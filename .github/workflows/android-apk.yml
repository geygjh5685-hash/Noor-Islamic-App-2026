name: Build Noor Islamic APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Create Android project
        run: flutter create --project-name=noor_islamic --platforms=android .

      - name: Enable core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          path = kts if kts.exists() else groovy

          if not path.exists():
              raise SystemExit("Gradle file not found")

          text = path.read_text()
          is_kts = path.suffix == ".kts"

          if "isCoreLibraryDesugaringEnabled" not in text and "coreLibraryDesugaringEnabled" not in text:
              match = re.search(r'(?m)^(\s*)compileOptions\s*\{', text)
              if not match:
                  raise SystemExit("compileOptions not found")
              indent = match.group(1) + "    "
              setting = "isCoreLibraryDesugaringEnabled = true" if is_kts else "coreLibraryDesugaringEnabled true"
              pos = match.end()
              text = text[:pos] + "\n" + indent + setting + text[pos:]

          dependency = "com.android.tools:desugar_jdk_libs:2.1.4"
          if dependency not in text:
              match = re.search(r'(?m)^dependencies\s*\{', text)
              line = f'    coreLibraryDesugaring("{dependency}")' if is_kts else f"    coreLibraryDesugaring '{dependency}'"
              if match:
                  pos = match.end()
                  text = text[:pos] + "\n" + line + text[pos:]
              else:
                  text += "\ndependencies {\n" + line + "\n}\n"

          path.write_text(text)
          print("Desugaring enabled")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Islamic-APK
          path: build/app/outputs/flutter-apk/app-release.apk
